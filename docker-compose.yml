services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: routie
      POSTGRES_USER: routie
      POSTGRES_PASSWORD: routie
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routie"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - routie-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - routie-redis:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - routie-minio:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 minio miniosecret; do sleep 1; done;
      mc mb --ignore-existing local/routie"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  routie-postgres:
  routie-redis:
  routie-minio:
